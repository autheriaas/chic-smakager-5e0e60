# Netlify config for Autheria's Community
# Only the generated public site is published; server sources stay separate.

[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

# ---- Caching ---------------------------------------------------------
# Images and video are named uniquely per asset and never change in place,
# so browsers and Netlify's CDN can cache them essentially forever. This
# is the single biggest "make the site feel fast" win for repeat visitors:
# without this, every image/video is re-checked with the server on every
# visit even though the bytes never change.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The chatbot widget script changes occasionally when it's updated, so
# give it a short cache instead of "immutable" — still fast, but a new
# deploy is picked up quickly.
[[headers]]
  for = "/js/autheria-chatbot-widget.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# HTML pages should always be re-checked so edits go live immediately,
# but a few basic security headers cost nothing and are good hygiene.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Never let search engines or caches serve a stale copy of admin pages.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
