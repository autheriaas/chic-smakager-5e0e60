<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Admin Login — Claudia's Community</title>
<style>
:root{
  --bg-deep:#1a1226; --bg-alt:#211732; --panel:#2f2144; --border:rgba(251,244,255,.12);
  --cream:#fbf4ff; --muted:rgba(251,244,255,.65);
  --teal:#2de6c6; --magenta:#ff3e9a; --yellow:#ffd23f; --violet:#9b6bff;
  --font-display:"Baloo 2", ui-rounded, system-ui, sans-serif;
  --font-body:"Plus Jakarta Sans", system-ui, sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0%,var(--bg-alt),var(--bg-deep));color:var(--cream);font-family:var(--font-body);padding:20px}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:32px 28px;box-shadow:0 24px 60px rgba(0,0,0,.4);opacity:0;transform:translateY(14px);animation:in .5s cubic-bezier(.16,.84,.44,1) forwards}
@keyframes in{to{opacity:1;transform:none}}
h1{font-family:var(--font-display);font-size:1.4rem;margin:0 0 6px;text-align:center}
p.sub{margin:0 0 24px;color:var(--muted);font-size:.88rem;text-align:center}
label{display:block;font-size:.82rem;font-weight:700;margin:14px 0 6px}
input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--bg-deep);color:var(--cream);font-size:.95rem;font-family:inherit;transition:border-color .2s ease,box-shadow .2s ease}
/* Keep inputs at 16px on touch devices so iOS Safari doesn't force-zoom
   the page when the field is focused. */
@media (max-width:640px){ input{font-size:16px} }
input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(45,230,198,.18)}
button{width:100%;margin-top:22px;padding:13px;border:none;border-radius:999px;background:var(--yellow);color:#1a1226;font-weight:800;font-size:.95rem;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
button:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(255,210,63,.28)}
button:disabled{opacity:.6;cursor:default;transform:none;box-shadow:none}
.msg{margin-top:14px;font-size:.85rem;text-align:center;min-height:1.2em}
.msg.err{color:var(--magenta)}
.msg.ok{color:var(--teal)}
.shake{animation:shake .38s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
</style>
</head>
<body>
<div class="card" id="card">
  <h1>Admin Login</h1>
  <p class="sub">Claudia's Community — staff only</p>
  <form id="loginForm" autocomplete="off">
    <label for="u">Username</label>
    <input id="u" name="username" type="text" autocomplete="username" required/>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required/>
    <button type="submit" id="submitBtn">Log in</button>
    <p class="msg" id="msg"></p>
  </form>
</div>
<script>
(function () {
  var form = document.getElementById('loginForm');
  var btn = document.getElementById('submitBtn');
  var msg = document.getElementById('msg');
  var card = document.getElementById('card');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'Checking…';
    msg.textContent = '';
    msg.className = 'msg';

    fetch('/.netlify/functions/admin-login', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('u').value,
        password: document.getElementById('p').value
      })
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (r) {
        if (r.ok) {
          msg.textContent = 'Logged in — redirecting…';
          msg.className = 'msg ok';
          setTimeout(function () { window.location.href = '/admin/'; }, 400);
        } else {
          msg.textContent = r.data.error || 'Login failed.';
          msg.className = 'msg err';
          btn.disabled = false;
          btn.textContent = 'Log in';
          card.classList.remove('shake');
          void card.offsetWidth;
          card.classList.add('shake');
        }
      })
      .catch(function () {
        msg.textContent = 'Could not reach the login server — try again in a moment.';
        msg.className = 'msg err';
        btn.disabled = false;
        btn.textContent = 'Log in';
      });
  });
})();
</script>
</body>
</html>
